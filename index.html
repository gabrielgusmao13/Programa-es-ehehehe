<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu primeiro site com Python</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
<h1>Meu primeiro site com Python2</h1>
<div id="saida">Carregando...</div>
<script type="py">
from pyscript import document
nome = "Gabriel Araujo Gusmao"
soma = 0
for i in range(1, 11):
    soma = soma + i
document.querySelector("#saida").innerText = (
    f"Ola, {nome}! A soma de 1 a 10 e {soma}."
)
</script>
</body>
</html>
